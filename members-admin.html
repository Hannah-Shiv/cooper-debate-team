<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster Manager — Cooper Debate Team</title>
  <link rel="stylesheet" href="css/main.css?v=22">
  <link rel="stylesheet" href="css/dome-nav.css">
  <style>
    /* ── Page layout ────────────────────────────────────── */
    .admin-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 100px 24px 80px;
    }
    .admin-page-title { margin-bottom: 28px; }
    .admin-page-title h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      color: #c8a96e;
      margin: 0 0 6px;
      font-weight: 600;
    }
    .admin-page-title p { color: #8fa0c0; font-size: 0.88rem; margin: 0; }

    /* ── Toolbar ────────────────────────────────────────── */
    .admin-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .admin-search {
      flex: 1;
      min-width: 180px;
      background: #0f1a35;
      border: 1px solid #1e3060;
      border-radius: 8px;
      color: #c8d8f0;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-family: 'Josefin Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .admin-search:focus { border-color: #c8a96e; }
    .admin-search::placeholder { color: #3a5080; }
    .btn-add {
      background: #c8a96e;
      color: #0a1128;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .btn-add:hover { opacity: 0.85; }
    .admin-count {
      color: #3a5080;
      font-size: 0.8rem;
      font-family: 'Josefin Sans', sans-serif;
      margin-bottom: 14px;
    }

    /* ── Table ──────────────────────────────────────────── */
    .admin-table-wrap {
      background: #0f1a35;
      border: 1px solid #1e3060;
      border-radius: 12px;
      overflow: hidden;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .admin-table thead th {
      background: #0a1128;
      color: #8fa0c0;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #1e3060;
    }
    .admin-table tbody tr {
      border-bottom: 1px solid #1a2850;
      transition: background 0.15s;
    }
    .admin-table tbody tr:last-child { border-bottom: none; }
    .admin-table tbody tr:hover { background: #122040; }
    .admin-table td {
      padding: 13px 16px;
      color: #c8d8f0;
      vertical-align: middle;
    }
    .td-name { font-weight: 600; color: #e8f0ff; }
    .td-email { color: #6a8ab0; font-size: 0.82rem; }
    .td-actions { white-space: nowrap; text-align: right; }

    /* Role badge */
    .role-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-family: 'Josefin Sans', sans-serif;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 700;
    }
    .role-badge.coach   { background: #c8a96e22; color: #c8a96e; border: 1px solid #c8a96e55; }
    .role-badge.captain { background: #7090e022; color: #90aeff; border: 1px solid #7090e055; }
    .role-badge.member  { background: #2a3a5522; color: #6a8ab0; border: 1px solid #2a3a5555; }

    /* Status dot */
    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .status-dot.active   { background: #4ade80; }
    .status-dot.inactive { background: #374151; }

    /* Action buttons */
    .btn-edit, .btn-remove {
      border: none;
      border-radius: 6px;
      padding: 6px 13px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      text-transform: uppercase;
    }
    .btn-edit   { background: #1e3060; color: #c8d8f0; margin-right: 6px; }
    .btn-remove { background: #2d1515; color: #f87171; }
    .btn-edit:hover, .btn-remove:hover { opacity: 0.75; }

    .admin-empty {
      text-align: center;
      padding: 60px 24px;
      color: #3a5080;
    }
    .admin-empty .ei { font-size: 2.2rem; display: block; margin-bottom: 10px; }
    .admin-empty p { font-size: 0.88rem; margin: 0; line-height: 1.6; }

    /* ── Modal backdrop ─────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 20, 0.75);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Add/Edit box */
    .modal-box {
      background: #0f1a35;
      border: 1px solid #1e3060;
      border-radius: 14px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 30px 24px;
      position: relative;
    }
    .modal-box::-webkit-scrollbar { width: 4px; }
    .modal-box::-webkit-scrollbar-thumb { background: #1e3060; border-radius: 4px; }

    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.55rem;
      color: #c8a96e;
      margin: 0 0 20px;
      font-weight: 600;
    }
    .modal-close {
      position: absolute;
      top: 14px; right: 16px;
      background: none;
      border: none;
      color: #3a5080;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s;
    }
    .modal-close:hover { color: #c8d8f0; }

    /* Form status */
    .form-status {
      font-size: 0.82rem;
      font-family: 'Josefin Sans', sans-serif;
      padding: 9px 13px;
      border-radius: 7px;
      display: none;
      margin-bottom: 16px;
    }
    .form-status.error   { background: #2d1515; color: #f87171; border: 1px solid #7f1d1d; }
    .form-status.success { background: #14291a; color: #86efac; border: 1px solid #166534; }

    /* Form grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
    }
    .form-field.full { grid-column: 1 / -1; }

    .form-field label {
      display: block;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #8fa0c0;
      margin-bottom: 5px;
    }
    .form-field label .opt { opacity: 0.45; font-weight: 400; text-transform: none; letter-spacing: 0; }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      background: #0a1128;
      border: 1px solid #1e3060;
      border-radius: 8px;
      color: #c8d8f0;
      padding: 9px 12px;
      font-size: 0.88rem;
      font-family: 'Josefin Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus { border-color: #c8a96e; }
    .form-field select option   { background: #0a1128; }
    .form-field textarea        { resize: vertical; min-height: 76px; line-height: 1.5; }
    .form-field input::placeholder,
    .form-field textarea::placeholder { color: #2a4060; }

    /* Event chips */
    .events-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .ev-chip input[type="checkbox"] { display: none; }
    .ev-chip label {
      display: inline-block;
      padding: 5px 13px;
      border: 1px solid #1e3060;
      border-radius: 20px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: #4a6090;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      font-weight: 700;
      user-select: none;
    }
    .ev-chip input:checked + label {
      background: #c8a96e1a;
      border-color: #c8a96e77;
      color: #c8a96e;
    }

    /* Active toggle */
    .toggle-row { display: flex; align-items: center; gap: 10px; }
    .tog {
      position: relative;
      width: 40px; height: 22px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .tog input { display: none; }
    .tog-slider {
      position: absolute;
      inset: 0;
      background: #1e3060;
      border-radius: 22px;
      transition: background 0.2s;
    }
    .tog-slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: #3a5080;
      border-radius: 50%;
      transition: all 0.2s;
    }
    .tog input:checked ~ .tog-slider            { background: #14422a; }
    .tog input:checked ~ .tog-slider::before    { background: #4ade80; transform: translateX(18px); }
    .toggle-lbl { font-family: 'Josefin Sans', sans-serif; font-size: 0.85rem; color: #8fa0c0; }

    /* Section divider in form */
    .form-divider {
      grid-column: 1 / -1;
      border: none;
      border-top: 1px solid #1a2850;
      margin: 4px 0;
    }

    /* Form actions */
    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #1a2850;
    }
    .btn-save {
      background: #c8a96e;
      color: #0a1128;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-save:hover { opacity: 0.85; }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-cancel {
      background: #1a2850;
      color: #8fa0c0;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-cancel:hover { opacity: 0.75; }

    /* Confirm delete box */
    .confirm-box {
      background: #0f1a35;
      border: 1px solid #3d1515;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      padding: 28px 30px;
      position: relative;
    }
    .confirm-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: #f87171;
      margin: 0 0 10px;
      font-weight: 600;
    }
    .confirm-body {
      color: #8fa0c0;
      font-size: 0.88rem;
      margin: 0 0 22px;
      line-height: 1.6;
    }
    .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-del {
      background: #7f1d1d;
      color: #f87171;
      border: 1px solid #3d1515;
      border-radius: 8px;
      padding: 9px 20px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-del:hover { opacity: 0.8; }

    /* Access denied state */
    .access-denied {
      text-align: center;
      padding: 80px 24px;
      color: #3a5080;
    }
    .access-denied p { font-size: 0.95rem; }

    /* Mobile */
    @media (max-width: 680px) {
      .admin-wrap { padding: 80px 14px 50px; }
      .form-grid  { grid-template-columns: 1fr; }
      .form-field.full { grid-column: 1; }
      .admin-table thead th:nth-child(3),
      .admin-table tbody td:nth-child(3),
      .admin-table thead th:nth-child(4),
      .admin-table tbody td:nth-child(4) { display: none; }
      .modal-box { padding: 20px 16px 18px; }
    }
  </style>
</head>
<body>

<!-- ── Site badge ─────────────────────────────────────────── -->
<a id="site-badge" href="index.html" aria-label="Cooper Debate Team — Home">
  <img src="images/cooper-debate-badge.png" alt="Cooper Debate Team"/>
</a>

<!-- ── User bar ───────────────────────────────────────────── -->
<div class="member-userbar" id="member-userbar">
  <button class="mub-bell" id="notif-btn" onclick="toggleNotifications()" title="Notifications">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span class="mub-notif-state" id="notif-state"></span>
  </button>
  <div class="mub-sep"></div>
  <span class="mub-name"  id="member-name"></span>
  <div class="mub-sep"></div>
  <span class="mub-email" id="member-email"></span>
  <div class="mub-sep"></div>
  <span class="mub-badge" id="member-role-badge">✓ Team Member</span>
  <div class="mub-sep"></div>
  <button class="mub-signout" onclick="handleSignOut()">
    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Sign Out
  </button>
</div>

<!-- ── Dome nav ───────────────────────────────────────────── -->
<div id="dome-nav-root"></div>

<!-- ── Loading ───────────────────────────────────────────── -->
<div id="mp-loading" class="auth-wrap">
  <div class="auth-box">
    <div class="spinner"></div>
    <h1 class="auth-title">Loading…</h1>
    <p class="auth-sub">Checking your session.</p>
  </div>
</div>

<!-- ── Admin content ─────────────────────────────────────── -->
<div id="mp-content" style="display:none">
  <div class="admin-wrap">

    <div class="admin-page-title">
      <h1>Roster Manager</h1>
      <p>Add, edit, or remove team members · Coach access only</p>
    </div>

    <div class="admin-toolbar">
      <input type="text" id="admin-search" class="admin-search"
             placeholder="Search by name, email, role, or event…"
             oninput="filterMembers(this.value)">
      <button class="btn-add" onclick="openAddModal()">+ Add Member</button>
    </div>
    <div class="admin-count" id="admin-count"></div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Email</th>
            <th>Events</th>
            <th>Status</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="admin-tbody">
          <tr><td colspan="6" style="text-align:center;padding:40px;color:#3a5080;font-family:'Josefin Sans',sans-serif;font-size:.85rem">Loading roster…</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<!-- ══ Add / Edit Modal ══════════════════════════════════════ -->
<div id="member-modal" class="modal-backdrop" style="display:none"
     onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()" aria-label="Close">×</button>
    <h2 class="modal-title" id="modal-title">Add Member</h2>
    <div class="form-status" id="form-status"></div>

    <form id="member-form" onsubmit="saveMember(event)" novalidate>
      <input type="hidden" id="form-doc-id">

      <div class="form-grid">

        <!-- Name row -->
        <div class="form-field">
          <label for="f-first">First Name <span style="color:#f87171">*</span></label>
          <input type="text" id="f-first" required autocomplete="given-name" placeholder="Hannah">
        </div>
        <div class="form-field">
          <label for="f-last">Last Name <span style="color:#f87171">*</span></label>
          <input type="text" id="f-last" required autocomplete="family-name" placeholder="Smith">
        </div>

        <!-- Email -->
        <div class="form-field full">
          <label for="f-email">Email <span style="color:#f87171">*</span></label>
          <input type="email" id="f-email" required autocomplete="email"
                 placeholder="hannah@cooperdebate.org">
        </div>

        <!-- Phone -->
        <div class="form-field full">
          <label for="f-phone">Phone <span class="opt">(optional)</span></label>
          <input type="tel" id="f-phone" autocomplete="tel" placeholder="(555) 123-4567">
        </div>

        <hr class="form-divider">

        <!-- Role + Grad Year -->
        <div class="form-field">
          <label for="f-role">Role <span style="color:#f87171">*</span></label>
          <select id="f-role" required>
            <option value="">Select role…</option>
            <option value="member">Member</option>
            <option value="captain">Captain</option>
            <option value="coach">Coach</option>
          </select>
        </div>
        <div class="form-field">
          <label for="f-grad">Grad Year <span class="opt">(optional)</span></label>
          <input type="number" id="f-grad" min="2020" max="2040" step="1"
                 placeholder="2026">
        </div>

        <!-- Events -->
        <div class="form-field full">
          <label>Events <span class="opt">(optional — select all that apply)</span></label>
          <div class="events-row">
            <span class="ev-chip"><input type="checkbox" id="ev-ld"    value="LD">     <label for="ev-ld">LD</label></span>
            <span class="ev-chip"><input type="checkbox" id="ev-pf"    value="PF">     <label for="ev-pf">PF</label></span>
            <span class="ev-chip"><input type="checkbox" id="ev-cx"    value="CX">     <label for="ev-cx">CX</label></span>
            <span class="ev-chip"><input type="checkbox" id="ev-cong"  value="Congress"><label for="ev-cong">Congress</label></span>
            <span class="ev-chip"><input type="checkbox" id="ev-parli" value="Parli">  <label for="ev-parli">Parli</label></span>
          </div>
        </div>

        <hr class="form-divider">

        <!-- Notes -->
        <div class="form-field full">
          <label for="f-notes">Coach Notes <span class="opt">(never shown to members)</span></label>
          <textarea id="f-notes" placeholder="Strengths, goals, context…"></textarea>
        </div>

        <!-- Active toggle -->
        <div class="form-field full">
          <label>Status</label>
          <div class="toggle-row">
            <label class="tog">
              <input type="checkbox" id="f-active" checked
                     onchange="document.getElementById('active-lbl').textContent=this.checked?'Active member':'Inactive / Alumni'">
              <span class="tog-slider"></span>
            </label>
            <span class="toggle-lbl" id="active-lbl">Active member</span>
          </div>
        </div>

      </div><!-- /form-grid -->

      <div class="form-actions">
        <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-save"   id="btn-save">Add Member</button>
      </div>
    </form>
  </div>
</div>

<!-- ══ Delete Confirm Modal ══════════════════════════════════ -->
<div id="delete-modal" class="modal-backdrop" style="display:none"
     onclick="if(event.target===this)cancelDelete()">
  <div class="confirm-box">
    <h2 class="confirm-title">Remove Member?</h2>
    <p class="confirm-body">
      This removes <strong id="delete-name" style="color:#e8f0ff"></strong> from the
      roster. Their tournament history is not affected.
    </p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="cancelDelete()">Cancel</button>
      <button class="btn-del"    onclick="confirmDelete()">Remove</button>
    </div>
  </div>
</div>

<!-- ── Auth shim: after members-auth.js so showState wraps it ── -->
<script>
(function () {
  var _orig = window.showState;
  window.showState = function (state) {
    if (state === 'login' || state === 'denied' || state === 'completing') {
      window.location.href = 'members-signon.html';
      return;
    }
    if (state === 'dashboard') {
      var role = window.currentUserRole || '';
      if (role !== 'coach') {
        // Non-coaches see a brief "coach-only" message then redirect
        var loading = document.getElementById('mp-loading');
        if (loading) {
          loading.innerHTML =
            '<div class="auth-box">' +
              '<h1 class="auth-title" style="color:#f87171">Coach Access Only</h1>' +
              '<p class="auth-sub">This page is restricted to coaches.</p>' +
            '</div>';
        }
        setTimeout(function () { window.location.href = 'members-directory.html'; }, 1800);
        return;
      }
      document.getElementById('mp-loading').style.display = 'none';
      document.getElementById('mp-content').style.display  = 'block';
      onAdminReady();
    }
    if (_orig) _orig(state);
  };
})();
</script>

<script>
/* ── Firebase init ──────────────────────────────────────── */

  apiKey:            "AIzaSyD0LYz6AAdiOKIrZ8cmaJEpfHBuYfm_TSc",
  authDomain:        "cooper-debate-team.firebaseapp.com",
  projectId:         "cooper-debate-team",
  storageBucket:     "cooper-debate-team.firebasestorage.app",
  messagingSenderId: "112813790184",
  appId:             "1:112813790184:web:ac559cb64747d7fd590a5d"
};
const adminApp = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(ADMIN_FB);
const adminDb  = firebase.firestore();

/* ── State ──────────────────────────────────────────────── */
let allMembers      = [];
let filteredMembers = [];
let pendingDeleteId = null;
let unsubRoster     = null;

/* ── Boot ───────────────────────────────────────────────── */
function onAdminReady() {
  loadRoster();
}

/* ── Real-time roster listener ──────────────────────────── */
function loadRoster() {
  unsubRoster = adminDb.collection('members')
    .orderBy('lastName')
    .onSnapshot(snap => {
      allMembers      = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
      filteredMembers = applyQuery(document.getElementById('admin-search').value, allMembers);
      renderTable(filteredMembers);
    }, err => {
      document.getElementById('admin-tbody').innerHTML =
        '<tr><td colspan="6" style="text-align:center;padding:30px;color:#f87171;font-family:\'Josefin Sans\',sans-serif;font-size:.85rem">' +
        'Error loading roster: ' + esc(err.message) + '</td></tr>';
    });
}

/* ── Render ─────────────────────────────────────────────── */
function renderTable(list) {
  const tbody = document.getElementById('admin-tbody');
  const count = document.getElementById('admin-count');
  const total = allMembers.length;
  count.textContent = list.length === total
    ? total + ' member' + (total !== 1 ? 's' : '')
    : list.length + ' of ' + total + ' shown';

  if (!list.length) {
    tbody.innerHTML =
      '<tr><td colspan="6"><div class="admin-empty">' +
        '<span class="ei">👥</span>' +
        '<p>' + (allMembers.length
          ? 'No members match your search.'
          : 'No members yet.<br>Click <strong>+ Add Member</strong> to build the roster.') +
        '</p></div></td></tr>';
    return;
  }

  tbody.innerHTML = list.map(m => {
    const name   = esc(((m.firstName || '') + ' ' + (m.lastName || '')).trim()) || '—';
    const email  = esc(m.email || '—');
    const role   = m.role || 'member';
    const events = (m.events || []).join(', ') || '—';
    const active = m.active !== false;
    const grad   = m.gradYear ? ` <span style="color:#3a5080;font-size:.78rem">'${String(m.gradYear).slice(-2)}</span>` : '';

    return `<tr>
      <td class="td-name">${name}${grad}</td>
      <td><span class="role-badge ${esc(role)}">${esc(role)}</span></td>
      <td class="td-email">${email}</td>
      <td style="color:#5a7090;font-size:.82rem">${esc(events)}</td>
      <td style="white-space:nowrap">
        <span class="status-dot ${active ? 'active' : 'inactive'}"></span>
        <span style="font-size:.82rem;color:${active ? '#4ade80' : '#374151'}">${active ? 'Active' : 'Inactive'}</span>
      </td>
      <td class="td-actions">
        <button class="btn-edit"   onclick="openEditModal('${esc(m.docId)}')">Edit</button>
        <button class="btn-remove" onclick="openDeleteModal('${esc(m.docId)}','${name}')">Remove</button>
      </td>
    </tr>`;
  }).join('');
}

/* ── Search ─────────────────────────────────────────────── */
function applyQuery(raw, list) {
  const q = (raw || '').toLowerCase().trim();
  if (!q) return list;
  return list.filter(m => {
    const full = ((m.firstName || '') + ' ' + (m.lastName || '')).toLowerCase();
    return full.includes(q)
        || (m.email  || '').toLowerCase().includes(q)
        || (m.role   || '').toLowerCase().includes(q)
        || (m.events || []).some(e => e.toLowerCase().includes(q));
  });
}
function filterMembers(val) {
  filteredMembers = applyQuery(val, allMembers);
  renderTable(filteredMembers);
}

/* ── Add modal ──────────────────────────────────────────── */
function openAddModal() {
  document.getElementById('modal-title').textContent = 'Add Member';
  document.getElementById('btn-save').textContent    = 'Add Member';
  document.getElementById('form-doc-id').value = '';
  document.getElementById('member-form').reset();
  document.getElementById('f-active').checked = true;
  document.getElementById('active-lbl').textContent = 'Active member';
  clearStatus();
  show('member-modal');
  setTimeout(() => document.getElementById('f-first').focus(), 60);
}

/* ── Edit modal ─────────────────────────────────────────── */
function openEditModal(docId) {
  const m = allMembers.find(x => x.docId === docId);
  if (!m) return;

  document.getElementById('modal-title').textContent = 'Edit Member';
  document.getElementById('btn-save').textContent    = 'Save Changes';
  document.getElementById('form-doc-id').value = docId;

  document.getElementById('f-first').value = m.firstName || '';
  document.getElementById('f-last').value  = m.lastName  || '';
  document.getElementById('f-email').value = m.email     || '';
  document.getElementById('f-phone').value = m.phone     || '';
  document.getElementById('f-role').value  = m.role      || 'member';
  document.getElementById('f-grad').value  = m.gradYear  || '';
  document.getElementById('f-notes').value = m.notes     || '';

  const active = m.active !== false;
  document.getElementById('f-active').checked          = active;
  document.getElementById('active-lbl').textContent    = active ? 'Active member' : 'Inactive / Alumni';

  ['ld','pf','cx','cong','parli'].forEach(id => {
    const el = document.getElementById('ev-' + id);
    if (el) el.checked = (m.events || []).includes(el.value);
  });

  clearStatus();
  show('member-modal');
}

/* ── Close / save ───────────────────────────────────────── */
function closeModal() { hide('member-modal'); }

async function saveMember(e) {
  e.preventDefault();
  clearStatus();

  const firstName = document.getElementById('f-first').value.trim();
  const lastName  = document.getElementById('f-last').value.trim();
  const email     = document.getElementById('f-email').value.trim().toLowerCase();
  const phone     = document.getElementById('f-phone').value.trim();
  const role      = document.getElementById('f-role').value;
  const gradYear  = parseInt(document.getElementById('f-grad').value) || null;
  const notes     = document.getElementById('f-notes').value.trim();
  const active    = document.getElementById('f-active').checked;
  const docId     = document.getElementById('form-doc-id').value;

  const events = ['ld','pf','cx','cong','parli']
    .map(id => document.getElementById('ev-' + id))
    .filter(el => el && el.checked)
    .map(el => el.value);

  if (!firstName)   { showErr('First name is required.'); return; }
  if (!lastName)    { showErr('Last name is required.'); return; }
  if (!email)       { showErr('Email is required.'); return; }
  if (!email.includes('@')) { showErr('Enter a valid email address.'); return; }
  if (!role)        { showErr('Please select a role.'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled    = true;
  btn.textContent = 'Saving…';

  const data = {
    firstName, lastName, email, phone, role,
    gradYear: gradYear || null,
    events, active, notes,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    if (docId) {
      await adminDb.collection('members').doc(docId).update(data);
    } else {
      data.addedAt = firebase.firestore.FieldValue.serverTimestamp();
      await adminDb.collection('members').add(data);
    }
    closeModal();
  } catch (err) {
    showErr('Save failed: ' + err.message);
    btn.disabled    = false;
    btn.textContent = docId ? 'Save Changes' : 'Add Member';
  }
}

/* ── Delete flow ────────────────────────────────────────── */
function openDeleteModal(docId, name) {
  pendingDeleteId = docId;
  document.getElementById('delete-name').textContent = name;
  show('delete-modal');
}
function cancelDelete() {
  pendingDeleteId = null;
  hide('delete-modal');
}
async function confirmDelete() {
  if (!pendingDeleteId) return;
  const id = pendingDeleteId;
  cancelDelete();
  try {
    await adminDb.collection('members').doc(id).delete();
  } catch (err) {
    alert('Delete failed: ' + err.message);
  }
}

/* ── Helpers ────────────────────────────────────────────── */
function show(id) { document.getElementById(id).style.display = 'flex'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }
function showErr(msg) {
  const el = document.getElementById('form-status');
  el.textContent  = msg;
  el.className    = 'form-status error';
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function clearStatus() {
  const el = document.getElementById('form-status');
  el.style.display = 'none';
  el.textContent   = '';
  el.className     = 'form-status';
}
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); cancelDelete(); }
});
</script>
