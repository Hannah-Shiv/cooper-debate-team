<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Cooper Debate Team — Tournament Calendar"/>
  <title>Members-Calendar — Cooper Debate Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css?v=13"/>
  <link rel="stylesheet" href="css/dome-nav.css"/>
  <style>
    /* ── Reset & base ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:   #e8b84b;
      --red:    #cc0000;
      --navy:   #1c2030;
      --cell:   #232840;
      --border: rgba(30,70,160,0.25);
      --white:  #ffffff;
      --muted:  rgba(255,255,255,0.45);
    }
    body { background: var(--navy); color: var(--white); font-family: 'Josefin Sans', sans-serif; }

    /* ── Page shell ──────────────────────────────────────── */
    .portal-page {
      min-height: 100vh;
      background: var(--navy);
      background-image:
        radial-gradient(ellipse 90% 50% at 50% -5%, rgba(20,40,100,0.25) 0%, transparent 65%),
        radial-gradient(ellipse 50% 30% at 85% 90%, rgba(15,30,80,0.15) 0%, transparent 60%);
      padding: 120px 32px 80px;
      transition: padding-top 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.dome-open .portal-page { padding-top: 240px; }
    @media(max-width:600px){
      body.dome-open .portal-page { padding-top: 210px; }
    }

    /* ── Auth / loading states ───────────────────────────── */
    .auth-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: calc(100vh - 180px);
    }
    .auth-box { width: 100%; max-width: 460px; text-align: center; }
    .auth-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem; font-weight: 600; color: var(--white); margin-bottom: 10px;
    }
    .auth-sub { font-size: 0.88rem; color: var(--muted); line-height: 1.75; }
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(232,184,75,0.15); border-top-color: var(--gold);
      animation: spin 0.8s linear infinite; margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Dashboard wrapper ───────────────────────────────── */
    .cal-wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; }

    /* ── Header ──────────────────────────────────────────── */
    .cal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 22px;
    }
    .cal-header-left h1 {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 3.5vw, 2.6rem); font-weight: 700;
      color: #b30000;
      line-height: 1;
      margin: 0 0 4px;
      letter-spacing: 0.03em;
      background: #e8b84b;
      padding: 10px 28px 12px;
      border-radius: 40px;
    }
    .cal-header-left .cal-email {
      font-size: 0.78rem; color: rgba(255,255,255,0.75); letter-spacing: 0.03em;
    }

    /* Header right — stacked: row1 = badge+signout, row2 = POST EVENT button */
    .cal-header-right {
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px; padding-top: 4px;
    }
    .cal-header-right-top {
      display: flex; align-items: center; gap: 10px;
    }

    /* userbar styles live in main.css (.mub-*) */

    /* ── POST / ADD EVENT button ──────────────────────────── */
    .post-event-btn {
      display: none; align-items: center; gap: 0;
      background: linear-gradient(135deg, #0a2a0a 0%, #113811 50%, #0d2f0d 100%);
      border: 1.5px solid #3a9a3a;
      border-radius: 12px; padding: 10px 18px 10px 12px;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 0 18px rgba(58,180,58,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
      width: 100%;
    }
    .post-event-btn:hover {
      border-color: #5cbf5c;
      box-shadow: 0 0 28px rgba(58,180,58,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }
    /* Wave bars on the left */
    .peb-waves {
      display: flex; flex-direction: column; gap: 3px; margin-right: 10px; flex-shrink: 0;
    }
    .peb-waves span {
      display: block; height: 2px; background: rgba(255,255,255,0.75);
      border-radius: 2px;
    }
    .peb-waves span:nth-child(1) { width: 14px; animation: wave 1.2s ease-in-out infinite; }
    .peb-waves span:nth-child(2) { width: 10px; animation: wave 1.2s ease-in-out 0.2s infinite; }
    .peb-waves span:nth-child(3) { width: 16px; animation: wave 1.2s ease-in-out 0.4s infinite; }
    @keyframes wave {
      0%, 100% { opacity: 0.45; transform: scaleX(1); }
      50%       { opacity: 1;   transform: scaleX(1.15); }
    }

    /* Calendar icon with checkmark */
    .peb-icon {
      position: relative; flex-shrink: 0; margin-right: 12px;
    }
    .peb-icon svg.peb-cal { width: 30px; height: 30px; }
    .peb-check {
      position: absolute; bottom: -3px; right: -5px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #3cb43c; border: 1.5px solid #0d2f0d;
      display: flex; align-items: center; justify-content: center;
    }
    .peb-check svg { width: 8px; height: 8px; }

    /* Text */
    .peb-text {
      display: flex; flex-direction: column; align-items: flex-start; flex: 1;
    }
    .peb-sub {
      font-size: 0.65rem; font-weight: 900; letter-spacing: 0.16em;
      text-transform: uppercase; color: #ffffff; line-height: 1;
      margin-bottom: 3px;
    }
    .peb-main {
      font-size: 1.3rem; font-weight: 900; letter-spacing: 0.06em;
      text-transform: uppercase; color: #ffffff; line-height: 1;
    }

    /* Arrow */
    .peb-arrow {
      font-size: 1.4rem; color: #ffffff;
      margin-left: 10px; font-weight: 700; flex-shrink: 0;
    }

    /* ── Next Tournament Banner ───────────────────────────── */
    .next-tournament-banner {
      display: none; align-items: center; gap: 0;
      background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 40%, #7f1d1d 100%);
      border: 1px solid rgba(220,38,38,0.55); border-radius: 10px;
      padding: 0; margin-bottom: 16px; overflow: hidden;
      width: 100%;
    }
    .next-trophy {
      padding: 9px 14px; font-size: 1.3rem;
      background: rgba(0,0,0,0.18); border-right: 1px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }
    .next-label {
      font-size: 0.65rem; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase;
      color: #ffffff; padding: 9px 12px; border-right: 1px solid rgba(255,255,255,0.15);
      flex-shrink: 0; white-space: nowrap;
    }
    .next-name {
      font-size: 1.1rem; font-weight: 900; color: #ffffff; letter-spacing: 0.02em;
      padding: 9px 16px; border-right: 1px solid rgba(255,255,255,0.15); flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .next-date {
      display: flex; align-items: center; gap: 6px;
      font-size: 1.1rem; color: #ffffff; font-weight: 700;
      padding: 9px 14px; border-right: 1px solid rgba(255,255,255,0.15); flex-shrink: 0;
      white-space: nowrap;
    }
    .next-countdown {
      display: flex; align-items: center; gap: 6px;
      font-size: 1.1rem; font-weight: 800; color: #ffffff;
      background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 16px; border-radius: 20px; margin: 0 12px; flex-shrink: 0; white-space: nowrap;
    }

    /* ── Legend ──────────────────────────────────────────── */
    .cal-legend {
      display: flex; gap: 20px; flex-wrap: wrap;
      margin-bottom: 14px; padding: 0 2px;
    }
    .leg-item {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #ffffff;
    }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── FullCalendar overrides ───────────────────────────── */
    #cal-container { border-radius: 10px; overflow: hidden; }

    .fc { font-family: 'Josefin Sans', sans-serif !important; --fc-bg-event-opacity: 1; }

    /* Toolbar */
    .fc .fc-toolbar {
      flex-wrap: wrap; gap: 8px;
      margin-bottom: 0 !important;
      padding: 14px 16px;
      background: #050e28;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }
    .fc .fc-toolbar-title {
      font-family: 'Cormorant Garamond', serif !important;
      font-size: 1.5rem !important; font-weight: 700 !important; color: var(--white) !important;
      letter-spacing: 0.02em;
    }

    /* Prev / Next / Today buttons */
    .fc .fc-button {
      background: rgba(255,255,255,0.06) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      color: rgba(255,255,255,0.6) !important;
      font-family: 'Josefin Sans', sans-serif !important;
      font-size: 0.65rem !important; font-weight: 700 !important;
      letter-spacing: 0.08em !important; text-transform: uppercase !important;
      padding: 6px 12px !important; border-radius: 6px !important;
      box-shadow: none !important; transition: all 0.15s !important;
    }
    .fc .fc-button:hover {
      background: rgba(255,255,255,0.12) !important;
      border-color: rgba(255,255,255,0.2) !important;
      color: var(--white) !important;
    }

    /* View tabs — MONTH / WEEK / DAY / AGENDA */
    .fc .fc-button-group .fc-button {
      border-radius: 0 !important;
      border-right-width: 0 !important;
    }
    .fc .fc-button-group .fc-button:first-child { border-radius: 6px 0 0 6px !important; }
    .fc .fc-button-group .fc-button:last-child  { border-radius: 0 6px 6px 0 !important; border-right-width: 1px !important; }
    .fc .fc-button-active,
    .fc .fc-button-primary:not(:disabled).fc-button-active {
      background: rgba(232,184,75,0.15) !important;
      border-color: rgba(232,184,75,0.5) !important;
      color: var(--gold) !important;
    }
    .fc .fc-button-primary:focus { box-shadow: none !important; }

    /* Show/Hide past deadlines custom button */
    .fc .fc-togglePastDeadlines-button {
      background: rgba(180,83,9,0.12) !important;
      border-color: rgba(217,119,6,0.35) !important;
      color: #fbbf24 !important;
      font-size: 0.6rem !important;
      white-space: nowrap !important;
    }
    .fc .fc-togglePastDeadlines-button:hover {
      background: rgba(180,83,9,0.25) !important;
      border-color: rgba(217,119,6,0.6) !important;
    }

    /* Column headers (SUN / MON / TUE…) — dark navy, clearly darker than royal-blue cells */
    .fc .fc-scrollgrid {
      border-color: rgba(30,68,160,0.4) !important;
      border-radius: 0 0 10px 10px;
    }
    .fc td, .fc th { border-color: rgba(30,68,160,0.35) !important; }
    .fc .fc-col-header { background: #1e44a0 !important; }
    .fc .fc-col-header-cell { background: #1e44a0 !important; border-bottom: none !important; }
    .fc .fc-col-header-cell.fc-day-today { background: #1e44a0 !important; }
    .fc .fc-col-header-cell-cushion {
      font-size: 0.65rem !important; font-weight: 900 !important;
      letter-spacing: 0.14em !important; text-transform: uppercase !important;
      color: #ffffff !important; text-decoration: none !important;
      padding: 11px 0 !important;
    }

    /* Day cells — dark navy base (JS overrides for event days) */
    td.fc-daygrid-day,
    .fc .fc-daygrid-day { background: #050e28 !important; }
    td.fc-daygrid-day:hover,
    .fc .fc-daygrid-day:hover { background: #0a1a3f !important; }
    .fc .fc-day-today { background: #050e28 !important; }
    .fc .fc-day-other .fc-daygrid-day-number { opacity: 0.3 !important; }
    .fc .fc-daygrid-day-number {
      font-size: 1.05rem !important; font-weight: 700 !important;
      color: #ffffff !important; text-decoration: none !important;
      padding: 6px 10px !important; position: relative !important; z-index: 3 !important;
    }
    .fc .fc-day-today .fc-daygrid-day-number {
      color: #ffd700 !important; font-weight: 900 !important; font-size: 1.15rem !important;
    }

    /* Minimum cell height */
    .fc .fc-daygrid-day-frame { min-height: 80px !important; position: relative !important; }

    /* "Today" watermark — visible only when the cell has no event */
    .cal-today-watermark {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255, 215, 0, 0.48);
      pointer-events: none; user-select: none;
      z-index: 0; white-space: nowrap;
    }

    /* Event pills — JS controls bg; CSS ensures wrap + cursor */
    .fc .fc-event {
      padding: 3px 6px !important;
      cursor: pointer !important;
      border-radius: 3px !important;
      box-shadow: none !important;
      white-space: normal !important;
      overflow: visible !important;
    }
    /* Month-view: pill is transparent — cell color from JS shows through */
    .fc-dayGridMonth-view .fc-event {
      background: transparent !important;
      border: none !important;
    }
    /* Event title — big, bold, wrapping */
    .fc .fc-event-title,
    .cal-evt-title {
      display: block !important;
      white-space: normal !important;
      word-break: break-word !important;
      font-size: 0.92rem !important;
      font-weight: 900 !important;
      line-height: 1.25 !important;
      letter-spacing: 0.01em !important;
    }
    /* TimeGrid event block */
    .fc .fc-timegrid-event {
      border-radius: 4px !important;
      overflow: visible !important;
    }
    .fc .fc-timegrid-event .fc-event-main {
      padding: 4px 6px !important;
      white-space: normal !important;
      overflow: visible !important;
    }
    .fc .fc-more-link {
      color: rgba(255,255,255,0.7) !important;
      font-size: 0.65rem !important; font-weight: 700 !important;
    }

    /* List/Agenda view */
    .fc .fc-list-event:hover td { background: rgba(255,255,255,0.04) !important; }
    .fc .fc-list-day-cushion { background: rgba(8,20,52,0.95) !important; }
    .fc .fc-list-day-text,
    .fc .fc-list-day-side-text {
      color: rgba(255,255,255,0.5) !important; text-decoration: none !important;
    }
    .fc .fc-list-event-title a { color: var(--white) !important; text-decoration: none !important; }
    .fc .fc-list-event-dot { border-color: currentColor !important; }
    .fc .fc-list-empty { background: var(--cell) !important; color: var(--muted) !important; }

    /* Time grid */
    .fc .fc-timegrid-slot-label-cushion {
      color: rgba(255,255,255,0.3) !important; font-size: 0.62rem !important;
    }
    .fc .fc-timegrid-col { background: var(--cell) !important; }
    .fc .fc-now-indicator-line { border-color: var(--gold) !important; }
    .fc .fc-scrollgrid-sync-table { border-color: var(--border) !important; }

    /* Popover */
    .fc .fc-popover {
      background: #0a1a3f !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 8px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
    }
    .fc .fc-popover-header { background: rgba(255,255,255,0.05) !important; color: var(--white) !important; }
    .fc .fc-popover-body { background: #0a1a3f !important; }
    .fc .fc-popover-close { color: rgba(255,255,255,0.5) !important; }

    /* ── Modals ───────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(4,10,28,0.9); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-box {
      background: linear-gradient(145deg, #0d1f3c, #071428);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
      padding: 28px 30px 32px; width: 100%; max-width: 560px;
      position: relative; max-height: 90vh; overflow-y: auto;
    }
    .modal-box.modal-wide { max-width: 700px; }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .modal-header > span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem; font-weight: 700; color: var(--white);
    }
    .modal-close-btn {
      background: none; border: none; color: rgba(255,255,255,0.4);
      cursor: pointer; padding: 4px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .modal-close-btn:hover { color: var(--white); background: rgba(255,255,255,0.08); }

    /* Post event form */
    .evt-form { display: flex; flex-direction: column; gap: 18px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    /* Date + Time paired row: date gets more width than time */
    .form-row-dt { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 7px; }
    .form-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; color: rgba(255,255,255,0.5);
    }
    .form-input {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13);
      border-radius: 10px; padding: 12px 16px; color: var(--white);
      font-family: 'Josefin Sans', sans-serif; font-size: 0.97rem;
      transition: border-color 0.15s;
    }
    .form-input:focus { outline: none; border-color: rgba(232,184,75,0.5); box-shadow: 0 0 0 3px rgba(232,184,75,0.08); }
    .form-input::placeholder { color: rgba(255,255,255,0.22); }
    .form-select { cursor: pointer; }
    .form-select option { background: #0d1f3c; }
    .form-textarea { resize: vertical; min-height: 96px; }
    .toggle-row {
      display: flex; align-items: center; gap: 12px;
      font-size: 0.92rem; color: rgba(255,255,255,0.65);
    }
    .toggle-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); cursor: pointer; }
    .form-footer {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 12px; flex-wrap: wrap; margin-top: 6px;
    }
    .btn-save {
      background: rgba(232,184,75,0.15); border: 1px solid rgba(232,184,75,0.45);
      color: var(--gold); font-family: 'Josefin Sans', sans-serif;
      font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 12px 28px; border-radius: 10px; cursor: pointer; transition: background 0.15s;
    }
    .btn-save:hover { background: rgba(232,184,75,0.28); }
    .btn-cancel {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.55); font-family: 'Josefin Sans', sans-serif;
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em;
      padding: 12px 22px; border-radius: 10px; cursor: pointer; transition: background 0.15s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.12); color: var(--white); }
    .btn-delete {
      display: none; align-items: center; gap: 6px; margin-right: auto;
      background: rgba(179,0,0,0.1); border: 1px solid rgba(179,0,0,0.3);
      color: #ff6b6b; font-family: 'Josefin Sans', sans-serif;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em;
      padding: 11px 16px; border-radius: 10px; cursor: pointer; transition: background 0.15s;
    }
    .btn-delete:hover { background: rgba(179,0,0,0.22); }

    /* Post event modal — bigger window */
    #post-event-modal .modal-box {
      max-width: 760px;
      padding: 36px 42px 42px;
    }
    #post-event-modal .modal-header > span {
      font-size: 1.6rem;
    }

    /* Event detail modal */
    .det-type-badge {
      display: inline-flex; align-items: center; padding: 3px 10px;
      border-radius: 4px; border: 1px solid;
      font-size: 0.6rem; font-weight: 900; letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .det-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem; font-weight: 700; color: var(--white);
      margin: 0 0 6px; line-height: 1.2;
    }
    .det-date { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 12px; }
    .det-countdown {
      display: inline-flex; align-items: center;
      background: rgba(232,184,75,0.1); border: 1px solid rgba(232,184,75,0.3);
      color: var(--gold); font-size: 0.75rem; font-weight: 700;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 20px;
    }
    .det-countdown.past {
      background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.35);
    }
    .det-section { margin-bottom: 18px; }
    .det-section-label {
      font-size: 0.6rem; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.3); margin-bottom: 8px;
    }
    .det-address { font-size: 0.88rem; color: rgba(255,255,255,0.7); margin-bottom: 10px; }
    .det-map {
      width: 100%; height: 220px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px;
    }
    .det-directions-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .det-from-input {
      flex: 1; min-width: 0;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 8px 12px; color: var(--white);
      font-family: 'Josefin Sans', sans-serif; font-size: 0.82rem;
    }
    .det-from-input::placeholder { color: rgba(255,255,255,0.2); }
    .det-from-input:focus { outline: none; border-color: rgba(232,184,75,0.4); }
    .det-dir-btn {
      background: rgba(232,184,75,0.12); border: 1px solid rgba(232,184,75,0.3);
      color: var(--gold); font-family: 'Josefin Sans', sans-serif;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s;
    }
    .det-dir-btn:hover { background: rgba(232,184,75,0.22); }
    .det-virtual-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(29,78,216,0.15); border: 1px solid rgba(59,130,246,0.3);
      color: #93c5fd; font-size: 0.8rem; font-weight: 700;
      padding: 5px 12px; border-radius: 6px; margin-bottom: 8px;
    }
    .det-deadline-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .det-deadline-date { font-size: 0.85rem; color: rgba(255,255,255,0.7); }
    .det-deadline-count {
      font-size: 0.7rem; font-weight: 700;
      background: rgba(217,119,6,0.15); border: 1px solid rgba(217,119,6,0.35);
      color: #fbbf24; padding: 2px 10px; border-radius: 20px;
    }
    .det-deadline-count.past {
      background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.35);
    }
    .det-link-btn {
      display: inline-flex; align-items: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7); font-family: 'Josefin Sans', sans-serif;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em;
      padding: 7px 14px; border-radius: 8px; text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .det-link-btn:hover { background: rgba(255,255,255,0.12); color: var(--white); }
    .det-notes { font-size: 0.85rem; color: rgba(255,255,255,0.55); line-height: 1.65; }
    .det-footer {
      display: flex; align-items: center; justify-content: flex-end; gap: 10px;
      flex-wrap: wrap; margin-top: 24px; padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .det-gcal-btn {
      display: inline-flex; align-items: center;
      background: rgba(66,133,244,0.1); border: 1px solid rgba(66,133,244,0.3);
      color: #7cb9f4; font-family: 'Josefin Sans', sans-serif;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em;
      padding: 7px 14px; border-radius: 8px; text-decoration: none;
      transition: background 0.15s;
    }
    .det-gcal-btn:hover { background: rgba(66,133,244,0.2); }
    .det-edit-btn {
      background: rgba(232,184,75,0.1); border: 1px solid rgba(232,184,75,0.3);
      color: var(--gold); font-family: 'Josefin Sans', sans-serif;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: background 0.15s;
    }
    .det-edit-btn:hover { background: rgba(232,184,75,0.2); }
    .det-delete-btn {
      display: inline-flex; align-items: center; gap: 6px; margin-right: auto;
      background: rgba(179,0,0,0.1); border: 1px solid rgba(179,0,0,0.3);
      color: #ff6b6b; font-family: 'Josefin Sans', sans-serif;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: background 0.15s;
    }
    .det-delete-btn:hover { background: rgba(179,0,0,0.22); border-color: rgba(179,0,0,0.5); }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 768px) {
      .portal-page { padding: 110px 16px 60px; }
      body.dome-open .portal-page { padding-top: 210px; }
      .cal-header { flex-direction: column; }
      .cal-header-left h1 { font-size: 2rem; }
      .form-row,
      .form-row-dt { grid-template-columns: 1fr; }
      .modal-box { padding: 20px 18px 24px; }
      #post-event-modal .modal-box { padding: 22px 20px 28px; }
      .fc .fc-toolbar { padding: 10px 12px; gap: 6px; }
      .fc .fc-toolbar-title { font-size: 1.15rem !important; }
      .fc .fc-button { font-size: 0.58rem !important; padding: 5px 8px !important; }
      .next-label { display: none; }
    }
  </style>
</head>
<body>

<div class="mp-topbar"></div>
<!-- SITE BADGE — home link, top left -->
<a id="site-badge" href="members-resources.html" aria-label="Members Portal — Home">
  <img src="images/cooper-debate-badge.png" alt="Cooper Debate Team"/>
</a>

<script>window.__NAV_PAGE = "calendar";</script>
<div id="dome-nav-root"></div>

<!-- CAL USERBAR — fixed vertical column, top-right, shown after auth -->
<div class="member-userbar" id="cal-userbar">
  <button class="mub-bell" id="cal-notif-btn" onclick="calToggleNotif()" title="Notifications">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span class="mub-notif-state" id="cal-notif-state"></span>
  </button>
  <div class="mub-sep"></div>
  <span class="mub-name" id="cal-name"></span>
  <div class="mub-sep"></div>
  <span class="mub-email" id="cal-user-email"></span>
  <div class="mub-sep"></div>
  <span class="mub-badge" id="cal-role-badge">✓ Team Member</span>
  <div class="mub-sep"></div>
  <button class="mub-signout" onclick="calSignOut()">
    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Sign Out
  </button>
</div>

<main class="portal-page">

  <!-- ── STATE: loading ──────────────────────────────────── -->
  <div id="cal-state-loading" class="auth-wrap">
    <div class="auth-box">
      <div class="spinner"></div>
      <h1 class="auth-title">Loading Calendar…</h1>
      <p class="auth-sub">Checking your session.</p>
    </div>
  </div>

  <!-- ── STATE: denied ───────────────────────────────────── -->
  <div id="cal-state-denied" class="auth-wrap" style="display:none">
    <div class="auth-box">
      <span style="font-size:3rem;display:block;margin-bottom:18px">🚫</span>
      <h1 class="auth-title">Access Not Approved</h1>
      <p class="auth-sub">Your email is not on the approved members list.</p>
      <a href="members-resources.html" style="display:inline-block;margin-top:20px;color:var(--gold);text-decoration:underline;font-size:0.85rem;">Return to Resources</a>
    </div>
  </div>

  <!-- ── STATE: dashboard ────────────────────────────────── -->
  <div id="cal-state-dashboard" style="display:none">
    <div class="cal-wrap">

      <!-- Header -->
      <div class="cal-header">
        <div class="cal-header-left">
          <h1>Calendar</h1>
        </div>
        <div class="cal-header-right">
          <!-- POST / ADD EVENT — coach/captain only -->
          <button class="post-event-btn" id="post-event-btn" onclick="openPostModal()">
            <div class="peb-waves"><span></span><span></span><span></span></div>
            <div class="peb-icon">
              <!-- Calendar grid icon — all white -->
              <svg class="peb-cal" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="4" width="24" height="22" rx="3" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>
                <rect x="2" y="4" width="24" height="7" rx="3" fill="rgba(255,255,255,0.25)"/>
                <line x1="9" y1="2" x2="9" y2="7" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
                <line x1="19" y1="2" x2="19" y2="7" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" stroke-linecap="round"/>
                <rect x="6"  y="14" width="4" height="3" rx="0.8" fill="rgba(255,255,255,0.7)"/>
                <rect x="12" y="14" width="4" height="3" rx="0.8" fill="rgba(255,255,255,0.9)"/>
                <rect x="18" y="14" width="4" height="3" rx="0.8" fill="rgba(255,255,255,0.7)"/>
                <rect x="6"  y="19" width="4" height="3" rx="0.8" fill="rgba(255,255,255,0.7)"/>
                <rect x="12" y="19" width="4" height="3" rx="0.8" fill="rgba(255,255,255,0.7)"/>
                <rect x="18" y="19" width="4" height="3" rx="0.8" fill="rgba(255,255,255,0.7)"/>
              </svg>
              <div class="peb-check">
                <svg viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="1.5,5 4,7.5 8.5,2.5"/>
                </svg>
              </div>
            </div>
            <div class="peb-text">
              <span class="peb-sub">Post / Add</span>
              <span class="peb-main">Event</span>
            </div>
            <div class="peb-arrow">›</div>
          </button>
        </div>
      </div>

      <!-- Next tournament banner -->
      <div class="next-tournament-banner" id="next-tournament-banner"></div>

      <!-- Legend -->
      <div class="cal-legend">
        <div class="leg-item"><div class="leg-dot" style="background:#991b1b"></div>Tournament</div>
        <div class="leg-item"><div class="leg-dot" style="background:#65a30d"></div>Practice</div>
        <div class="leg-item"><div class="leg-dot" style="background:#ffd700"></div>Meeting</div>
      </div>

      <!-- FullCalendar mount -->
      <div id="cal-container"></div>

    </div>
  </div>

</main>

<!-- ── Event Detail Modal ──────────────────────────────────── -->
<div class="modal-overlay" id="det-modal" style="display:none"
     onclick="if(event.target===this)closeEventDetail()">
  <div class="modal-box modal-wide">
    <div class="modal-header">
      <span>Event Details</span>
      <button class="modal-close-btn" onclick="closeEventDetail()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="det-modal-body"></div>
  </div>
</div>

<!-- ── Post / Edit Event Modal ─────────────────────────────── -->
<div class="modal-overlay" id="post-event-modal" style="display:none"
     onclick="if(event.target===this)closePostModal()">
  <div class="modal-box">
    <div class="modal-header">
      <span id="post-modal-title">📅 Post Event</span>
      <button class="modal-close-btn" onclick="closePostModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="evt-form">

      <!-- Event Name — full width -->
      <div class="form-group">
        <label class="form-label" for="evt-title">Event Name *</label>
        <input class="form-input" id="evt-title" type="text" placeholder="e.g. Langley Fall Invitational" maxlength="100"/>
      </div>

      <!-- Event Type — full width -->
      <div class="form-group">
        <label class="form-label" for="evt-type">Event Type</label>
        <select class="form-input form-select" id="evt-type" onchange="onTypeChange()">
          <option value="tournament">🏆 Tournament</option>
          <option value="practice">🟢 Practice</option>
          <option value="meeting">📋 Meeting</option>
        </select>
      </div>

      <!-- Start Date + Start Time on same line -->
      <div class="form-row-dt">
        <div class="form-group">
          <label class="form-label" for="evt-start">Start Date *</label>
          <input class="form-input" id="evt-start" type="date"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="evt-start-time">Start Time <span style="opacity:.45;font-weight:400">(EST)</span></label>
          <input class="form-input" id="evt-start-time" type="time" value="08:00"/>
        </div>
      </div>

      <!-- End Date + End Time on same line -->
      <div class="form-row-dt">
        <div class="form-group">
          <label class="form-label" for="evt-end">End Date <span style="opacity:.45;font-weight:400">(multi-day)</span></label>
          <input class="form-input" id="evt-end" type="date"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="evt-end-time">End Time <span style="opacity:.45;font-weight:400">(EST)</span></label>
          <input class="form-input" id="evt-end-time" type="time" value="16:30"/>
        </div>
      </div>

      <!-- Virtual toggle -->
      <div class="form-group">
        <div class="toggle-row">
          <input type="checkbox" id="evt-virtual" onchange="toggleVirtualLabel()"/>
          <label for="evt-virtual">Virtual / Online event</label>
        </div>
      </div>

      <!-- Location -->
      <div class="form-group">
        <label class="form-label" id="evt-location-label" for="evt-location">Venue Address <span style="opacity:.45;font-weight:400">(optional)</span></label>
        <input class="form-input" id="evt-location" type="text" placeholder="123 Main St, Fairfax, VA"/>
      </div>

      <!-- Schedule link -->
      <div class="form-group">
        <label class="form-label" for="evt-schedule">Event Day Schedule Link <span style="opacity:.45;font-weight:400">(optional)</span></label>
        <input class="form-input" id="evt-schedule" type="url" placeholder="https://docs.google.com/…"/>
      </div>

      <!-- Notes -->
      <div class="form-group">
        <label class="form-label" for="evt-notes">Notes <span style="opacity:.45;font-weight:400">(optional)</span></label>
        <textarea class="form-input form-textarea" id="evt-notes" placeholder="Anything members should know…" rows="3" maxlength="600"></textarea>
      </div>

      <div class="form-footer">
        <button class="btn-delete" id="evt-delete-btn" onclick="deleteEvent()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
          Delete
        </button>
        <button class="btn-cancel" onclick="closePostModal()">Cancel</button>
        <button class="btn-save" id="evt-save-btn" onclick="saveEvent()">Save Event</button>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- FullCalendar v6 — loaded AFTER Firebase so it doesn't block Firebase init -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script src="data/approved-members.js?v=2"></script>
<script src="data/admins.js"></script>
<script src="js/calendar.js?v=22"></script>

<script src="js/members-nav.js?v=6"></script>
<script src="js/dome-nav.js"></script>
<script src="js/main.js"></script>

<script>
/* ── Notification toggle (calendar page) ─────────────────── */
function calUpdateNotifState() {
  var badge = document.getElementById('cal-notif-state');
  if (badge && 'Notification' in window) badge.classList.toggle('on', Notification.permission === 'granted');
}
function calToggleNotif() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') return;
  if (Notification.permission === 'denied') { alert('Notifications are blocked.\nEnable via the lock icon in your browser address bar.'); return; }
  Notification.requestPermission().then(calUpdateNotifState);
}
document.addEventListener('DOMContentLoaded', calUpdateNotifState);
</script>

</body>
</html>
